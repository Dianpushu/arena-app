<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>無法連線 - Arena</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0e;
        color: #e8e8ee;
        font-family: 'Segoe UI', 'Microsoft JhengHei', 'Microsoft YaHei', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        text-align: center;
        max-width: 440px;
        padding: 24px;
      }
      .icon {
        font-size: 52px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #9a9aa8;
        line-height: 1.8;
        font-size: 14px;
      }
      button {
        margin-top: 12px;
        background: #38bdf8;
        color: #06222f;
        font-weight: 600;
        font-size: 14px;
        font-family: inherit;
        border: none;
        border-radius: 8px;
        padding: 10px 28px;
        cursor: pointer;
      }
      button:hover {
        background: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>無法連線到 arena.ai</h1>
      <p>請檢查網路連線，連線恢復後可以按下方按鈕重試。<br />（你的登入狀態與分頁都不會不見）</p>
      <button id="retry">重新連線</button>
    </div>
    <script>
      function retry() {
        // 離線頁跑在內容分頁裡：透過 preload 暴露的最小 API 要求主進程重載。
        // 注意：這裡不能用 location.reload()，那只會重載離線頁自己。
        if (window.arena && window.arena.tabs && window.arena.tabs.reloadActive) {
          window.arena.tabs.reloadActive();
        } else {
          location.reload();
        }
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', function () {
        setTimeout(retry, 800);
      });
    </script>
  </body>
</html>
