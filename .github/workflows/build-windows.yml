name: Build Windows

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 發佈 GitHub Release（自動更新的來源）需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen:icon
      - run: npm run build

      # 打 v* tag 才發佈到 GitHub Releases；一般 push 只編譯驗證。
      - run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist-release/*.exe
            dist-release/*.yml
            dist-release/*.blockmap
