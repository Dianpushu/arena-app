name: Build Windows

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: '打包成功後發布測試版（版本號必須包含 -beta.）'
        type: boolean
        default: false

permissions:
  contents: write # 發佈 GitHub Release（自動更新的來源）需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate prerelease version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') {
            throw "Refusing to publish a non-beta version: $version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen:icon
      - run: npm run build

      # 打 v* tag 才發佈到 GitHub Releases；一般 push 只編譯驗證。
      - run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist-release/*.exe
            dist-release/*.yml
            dist-release/*.blockmap

      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "dist-release/Arena-Setup-$version.exe"
          $portable = "dist-release/Arena-$version-portable.exe"
          $metadata = 'dist-release/beta.yml'
          $blockmap = "$setup.blockmap"
          foreach ($path in @($setup, $portable, $metadata, $blockmap)) {
            if (!(Test-Path $path)) { throw "Missing release asset: $path" }
          }
          gh release create "v$version" $setup $portable $metadata $blockmap `
            --target "$env:GITHUB_SHA" --prerelease --latest=false `
            --title "Arena v$version（測試版）" --notes-file .github/prerelease-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish prerelease' }
